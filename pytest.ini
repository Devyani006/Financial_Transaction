[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default markers
markers =
    unit: pure unit tests, no external dependencies
    integration: requires MySQL and .env to be configured

# Show short test summary
addopts = -v --tb=short -ra

# Asyncio mode for any async tests
asyncio_mode = auto
